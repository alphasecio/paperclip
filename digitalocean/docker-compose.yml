services:
  paperclip:
    build: .
    container_name: paperclip
    restart: unless-stopped
    ports:
      - "${PAPERCLIP_BIND:-127.0.0.1}:3100:3100"
    volumes:
      - paperclip_data:/paperclip
    env_file:
      - .env
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from ${CADDY_DOMAIN} --to paperclip:3100
    depends_on:
      - paperclip
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - https

volumes:
  paperclip_data:
  caddy_data:
  caddy_config:
